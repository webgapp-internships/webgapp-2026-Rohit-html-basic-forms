<!DOCTYPE html>
    <html>
        <head>
             <h1> BIODATA </h1>
             <h3> Fill your information </h3>
             <form>
                   <label>Name:</label>
                   <input type="text" placeholder="Enter your name" required><br><br>
                   <label>Father's Name:</label>
                   <input type="text" placeholder="Enter your father's name"><br><br>
                   <label>Mother's Name:</label>
                   <input type="text" placeholder="Enter your mother's name"><br><br>
                   <label>Email:</label>
                   <input type="email" placeholder="Enter your email"><br><br>
                   <label>Password:</label>
                   <input type="password" placeholder="Enter your password"><br><br>
                   <label>Phone Number:</label>
                   <input type="tel" placeholder="Enter your phone number" maxlength="10"><br><br>
                   <label>Gender:</label>
                     <input type="radio" name="gender" value="male"> Male   
                     <input type="radio" name="gender" value="female"> Female <br><br>
                   <label>Age:</label>
                   <input type="number" placeholder="Enter your age"><br><br>
                   <label>Date of birth:</label>
                   <input type="date" placeholder="Enter your date of birth"><br><br>
                     <label>Skills:</label>
                        <input type="checkbox"> HTML
                        <input type="checkbox"> CSS
                        <input type="checkbox"> JavaScript
                        <input type="checkbox"> Python<br><br>
                     <label>Hobbies:</label>
                        <input type="checkbox"> gaming
                        <input type="checkbox"> watching anime
                        <input type="checkbox"> sleeping<br><br>
                        <label>Department:</label>
                        <select>
                            <option value="Computer science Engineering">CSE</option>
                            <option value="Electronics and Communication Engineering">ECE</option>
                            <option value="Mechanical Engineering">MECH</option>
                         </select><br><br>
                         <label>Address:</label><br>
                         <textarea rows="5" cols="40" placeholder="Enter your address"></textarea><br><br>
                         <label>Upload your file:</label>
                         <input type="file"><br><br>
                         <button type="submit">Submit</button><br>
                         <button type="reset">Reset</button>
